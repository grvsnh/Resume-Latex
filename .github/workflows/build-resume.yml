name: Build Resume

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      - name: Build PDF and preview
        run: |
          typst compile resume.typ resume.pdf --root .
          typst compile resume.typ resume-page-{p}.png --format png --ppi 300 --root .
          shopt -s nullglob
          pages=(resume-page-*.png)
          test "${#pages[@]}" -eq 1
          mv "${pages[0]}" resume-preview.png
          cp resume.pdf gaurav-singh.pdf

      - name: Read release metadata
        id: release
        run: |
          title="$(head -n 1 release-info.txt | tr -d '\r')"
          git fetch --tags --force
          last="$(git tag -l 'v[0-9]*' | sed 's/^v//' | sort -n | tail -n 1)"
          tag="v$(( ${last:-0} + 1 ))"
          {
            echo "title=$title"
            echo "tag=$tag"
            echo "body<<RELEASE_BODY"
            cat release-body.txt
            echo "RELEASE_BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Commit preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resume-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "chore: update resume preview [skip ci]"
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: gaurav-singh.pdf
          path: gaurav-singh.pdf

      - name: Create release
        run: |
          git tag -a "${{ steps.release.outputs.tag }}" -m "Resume - ${{ steps.release.outputs.title }}"
          git push origin "${{ steps.release.outputs.tag }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Resume - ${{ steps.release.outputs.title }}
          body: ${{ steps.release.outputs.body }}
          files: |
            gaurav-singh.pdf
            resume-preview.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
