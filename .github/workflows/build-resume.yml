name: Build and Release Resume PDF

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**.tex'
      - '**.cls'
      - 'links/**'
      - 'sections/**'
      - 'release-info.txt'
      - 'release-body.txt'
      - '.github/workflows/build-resume.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          compiler: pdflatex
          args: "-interaction=nonstopmode -halt-on-error"

      - name: Read Release Metadata
        id: release_meta
        shell: bash
        run: |
          INFO_FILE=""
          for f in release-info.txt release_info.txt release-info release_info; do
            if [ -f "$f" ]; then
              INFO_FILE="$f"
              break
            fi
          done

          TITLE=""
          if [ -n "$INFO_FILE" ]; then
            TITLE="$(sed -n '1p' "$INFO_FILE" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          fi
          if [ -z "$TITLE" ]; then
            TITLE="AI Engineer"
          fi

          BODY_FILE=""
          for f in release-body.txt release_body.txt release-body release_body; do
            if [ -f "$f" ] && [ -s "$f" ]; then
              BODY_FILE="$f"
              break
            fi
          done

          if [ -n "$BODY_FILE" ]; then
            BODY="$(cat "$BODY_FILE")"
          elif [ -n "$INFO_FILE" ]; then
            BODY="$(tail -n +2 "$INFO_FILE")"
          else
            BODY=""
          fi

          SLUG="$(printf '%s' "$TITLE" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-//; s/-$//')"
          [ -z "$SLUG" ] && SLUG="ai-engineer"

          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<RELEASE_BODY'
            printf '%s\n' "$BODY"
            echo 'RELEASE_BODY'
          } >> "$GITHUB_OUTPUT"

      - name: Prepare Named Resume PDF
        run: cp resume.pdf "resume-${{ steps.release_meta.outputs.slug }}.pdf"

      - name: Generate High-Resolution Resume Preview Image
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          pdftoppm -png -r 300 -singlefile resume.pdf resume-preview

      - name: Commit and Push Resume Preview Image
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add resume-preview.png
          if git diff --staged --quiet; then
            echo "No changes to resume preview image."
          else
            git commit -m "chore: update resume preview image [skip ci]"
            git push
          fi

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-${{ steps.release_meta.outputs.slug }}
          path: resume-${{ steps.release_meta.outputs.slug }}.pdf
          overwrite: true

      - name: Generate Release Tag
        id: tag_meta
        run: |
          git fetch --tags --force 2>/dev/null || true
          LAST_TAG=$(git tag -l 'v[0-9]*' | sed 's/^v//' | sort -n | tail -1)
          if [ -z "$LAST_TAG" ]; then
            NEXT_NUM=1
          else
            NEXT_NUM=$((LAST_TAG + 1))
          fi
          TAG_NAME="v${NEXT_NUM}"
          git tag -a "$TAG_NAME" -m "Resume - ${{ steps.release_meta.outputs.title }}"
          git push origin "$TAG_NAME"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        with:
          tag_name: ${{ steps.tag_meta.outputs.tag_name }}
          name: Resume - ${{ steps.release_meta.outputs.title }}
          body: |
            ${{ steps.release_meta.outputs.body }}

            - **Release:** `${{ steps.tag_meta.outputs.tag_name }}`
            - **Commit:** ${{ github.sha }}
            - **Trigger:** `${{ github.event_name }}` on `${{ github.ref_name }}`
          draft: false
          prerelease: false
          files: |
            resume-${{ steps.release_meta.outputs.slug }}.pdf
            resume-preview.png
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
