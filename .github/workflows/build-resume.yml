name: Build and Release Resume PDF

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - '**.tex'
      - '**.cls'
      - 'links/**'
      - 'sections/**'
      - '.github/workflows/build-resume.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          compiler: pdflatex
          args: "-interaction=nonstopmode -halt-on-error"

      - name: Prepare Named Resume PDF
        run: cp resume.pdf gaurav-singh.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaurav-singh-pdf
          path: gaurav-singh.pdf
          overwrite: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        with:
          tag_name: latest
          name: "Latest Resume Build"
          body: "Automatically compiled `gaurav-singh.pdf` generated by GitHub Actions."
          draft: false
          prerelease: false
          files: gaurav-singh.pdf
          overwrite: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
