name: Build and Release Resume PDF

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths:
      - '**.tex'
      - '**.cls'
      - 'links/**'
      - 'sections/**'
      - '.github/workflows/build-resume.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          compiler: pdflatex
          args: "-interaction=nonstopmode -halt-on-error"

      - name: Prepare Named Resume PDF
        run: cp resume.pdf gaurav-singh.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaurav-singh-pdf
          path: gaurav-singh.pdf
          overwrite: true

      - name: Generate Release Tag and Metadata
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_TITLE="Resume Release ${TAG_NAME}"
          else
            TAG_NAME="v${{ github.run_number }}"
            RELEASE_TITLE="Resume Build #${{ github.run_number }}"
          fi
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_title }}
          body: |
            Automatically compiled `gaurav-singh.pdf` generated by GitHub Actions.

            - **Build Number:** #${{ github.run_number }}
            - **Commit:** ${{ github.sha }}
            - **Trigger:** `${{ github.event_name }}` on `${{ github.ref_name }}`
          draft: false
          prerelease: false
          files: gaurav-singh.pdf
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
